[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-keys"
version = "1.0.0"
description = "Route keys: a route's identity computed from its line (recipe v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["h3>=4.1,<5"]

[project.urls]
Homepage = "https://github.com/hikeratlas/route-keys"

[tool.setuptools]
packages = ["route_keys"]

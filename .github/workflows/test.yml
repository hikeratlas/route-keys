name: Test

# Both implementations against vectors/v1.json (and its frozen hash), on the
# oldest and newest versions they support.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - { python: '3.9', h3: 'h3==4.1.0' }
          - { python: '3.13', h3: 'h3>=4.1,<5' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '${{ matrix.h3 }}'
      - run: python -m unittest discover -s python/tests -v
      - name: Installs as a package
        run: pip install ./python && cd /tmp && python -c "import route_keys; print(route_keys.route_key([[-116.2, 51.4], [-116.19, 51.4]], 'w'))"

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: The packed tarball works
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/ts/hikeratlas-route-keys-*.tgz
          node --input-type=module -e "import { routeKey } from '@hikeratlas/route-keys'; console.log(routeKey([[-116.2, 51.4], [-116.19, 51.4]], 'w'))"

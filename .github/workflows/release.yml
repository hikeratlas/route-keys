name: Release

# On main, when the packages' version has no release yet: test, then publish
# a GitHub release (and its tag, v<version>) with the TypeScript package's
# tarball, which consumers install by URL (npm can't install a git dependency
# from a subdirectory). Python installs from the tag. To release, bump the
# version in ts/package.json and python/pyproject.toml in a PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The version, and whether it's released
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p "require('./ts/package.json').version")"
          grep -q "^version = \"$v\"$" python/pyproject.toml || { echo "python/pyproject.toml isn't version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.v.outputs.new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: steps.v.outputs.new == 'true'
        run: pip install 'h3>=4.1,<5' && python -m unittest discover -s python/tests
      - if: steps.v.outputs.new == 'true'
        working-directory: ts
        run: npm ci --no-audit --no-fund && npm test && npm pack
      - if: steps.v.outputs.new == 'true'
        name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          gh release create "$tag" ts/hikeratlas-route-keys-*.tgz --target "$GITHUB_SHA" --title "$tag" \
            --notes "Route keys, recipe v1 (a draft until 1.0). TypeScript: install the attached tarball by URL. Python: pip install \"route-keys @ git+https://github.com/hikeratlas/route-keys@$tag#subdirectory=python\"."
